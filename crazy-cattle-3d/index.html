<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crazy Cattle 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#gameContainer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
#unity-canvas{display:block;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:#000}
#loading{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);color:#fff;text-align:center;font:16px Arial,sans-serif;pointer-events:none}
#bar{width:min(320px,70vw);height:8px;margin:12px auto;background:#333;border-radius:10px;overflow:hidden}
#progress{height:100%;width:0;background:#fff}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">Loading Crazy Cattle 3D<div id="bar"><div id="progress"></div></div></div>
</div>
<script>
/* Compatibility stubs for platform API calls; no external ad services are loaded. */
window.SubmitLeaderboardScore=function(){};
window.GetLeaderboardEntries=function(){};
window.InitApi=function(){};
window.InitExternEval=function(){};
window.ExternEval=function(){};
window.PreloadRewarded=function(){};
window.ShowRewarded=function(){};
window.RewardedReady=function(){};
window.RewardedSuccess=function(){};
window.RewardedFail=function(){};
window.RewardedClose=function(){};
</script>
<script src="Build/game.loader.js"></script>
<script>
(function(){
  var canvas=document.getElementById("unity-canvas");
  var loading=document.getElementById("loading");
  var progress=document.getElementById("progress");
  var config={
    dataUrl:"Build/game.data.unityweb",
    frameworkUrl:"Build/game.framework.js.unityweb",
    codeUrl:"Build/game.wasm.unityweb",
    streamingAssetsUrl:"StreamingAssets",
    companyName:"FreezeNova",
    productName:"Crazy Cattle 3D",
    productVersion:"0.1"
  };
  function resize(){
    var w=window.innerWidth,h=window.innerHeight,ratio=960/540;
    if(w/h>ratio) w=h*ratio; else h=w/ratio;
    canvas.style.width=Math.floor(w)+"px";
    canvas.style.height=Math.floor(h)+"px";
  }
  window.addEventListener("resize",resize);resize();
  if(typeof createUnityInstance!=="function"){
    loading.textContent="Game loader failed to load. Check the Build folder.";
    return;
  }
  createUnityInstance(canvas,config,function(p){
    progress.style.width=(p*100)+"%";
  }).then(function(instance){
    window.gameInstance=instance;
    loading.style.display="none";
    resize();
  }).catch(function(error){
    console.error(error);
    loading.textContent="The game could not start. Open the browser console for details.";
  });
})();
</script>
</body>
</html>
